name: Belgesel Üret

# Türkçe tarih belgeseli üretimi — YALNIZCA elle tetiklenir (zamanlayıcı yok).
# Plan: docs/PROJE_PLANI_TARIH_SERISI.md
#
#   mod=inceleme : Commons filmlerinden kare sayfaları + Pexels aday sayfaları
#               → "inceleme/<slug>" dalına commit (Claude kesit/ID seçer) + Telegram.
#   mod=ornek : ilk N bölüm → 1080p önizleme (artifact). Kalite onayı için;
#               tüm videoya ses kredisi harcanmaz.
#   mod=ses   : yalnızca anlatım (ElevenLabs) → önbellek + kalıcı yedek. Klipler
#               henüz yokken gerçek cümle sürelerini öğrenip kurguyu ona göre kurmak için.
#   mod=drive : herkese açık Google Drive dosyasını (klip zip'i) indirip "klipler-<klasör>"
#               Release'ine yükler (bulut oturumu Drive'a erişemiyor; oradan alınır).
#   mod=tam   : tüm video → YouTube'a GİZLİ yükleme (yayin verilirse o saatte
#               YouTube kendisi yayınlar). Siz izleyip onaylamadan herkese açılmaz.
#
# Gerekli secrets: ELEVENLABS_API_KEY, TTS_VOICE_ID_TR (Türkçe ses),
#   uyku belgeselleri için ELEVENLABS_API_KEY_UYKU, TTS_VOICE_ID_UYKU,
#   YOUTUBE_CLIENT_SECRETS_B64, YOUTUBE_TOKEN_B64, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# İsteğe bağlı: DOC_PLAYLIST_ID (seri oynatma listesi)

on:
  workflow_dispatch:
    inputs:
      klasor:
        description: "Senaryo klasörü"
        default: belgeseller/01-hititler
      mod:
        description: "ornek = önizleme, tam = YouTube'a gizli yükleme"
        type: choice
        options: [inceleme, ses, ornek, tam, shorts, sosyal, drive, seskontrol]
        default: ornek
      ornek_bolum:
        description: "Örnekte kaç bölüm (giriş + ilk bölüm = 2)"
        default: "2"
      yayin:
        description: "Planlı yayın (ISO-8601 UTC, ör. 2026-11-04T16:00:00Z). Boşsa gizli kalır."
        required: false
      kaynak_url:
        description: "mod=drive: herkese açık Google Drive dosya bağlantısı (klip zip'i)"
        required: false
      ses_hesabi:
        description: "ElevenLabs hesabı: otomatik (klasör adında 'uyku' varsa uyku hesabı), ana ya da uyku"
        type: choice
        options: [otomatik, ana, uyku]
        default: otomatik
      sadece:
        description: "mod=shorts: yalnızca bu Short kimliğini yeniden üret ve yükle (ör. col). Sosyal paket bu çalışmada güncellenmez."
        required: false

concurrency:
  group: belgesel-${{ inputs.klasor }}
  cancel-in-progress: false

permissions:
  contents: write   # yalnızca inceleme modu: inceleme dalına kare sayfaları yazar

jobs:
  uret:
    runs-on: ubuntu-latest
    # 35 dk video ≈ 2,5 saat render (2 çekirdek) + ses + yükleme
    timeout-minutes: 345
    env:
      # Uyku belgeselleri (klasör adında "uyku") ayrı ElevenLabs hesabı ve sesiyle seslendirilir
      ELEVENLABS_API_KEY: ${{ (inputs.ses_hesabi == 'uyku' || (inputs.ses_hesabi != 'ana' && contains(inputs.klasor, 'uyku'))) && secrets.ELEVENLABS_API_KEY_UYKU || secrets.ELEVENLABS_API_KEY }}
      TTS_VOICE_ID_TR: ${{ (inputs.ses_hesabi == 'uyku' || (inputs.ses_hesabi != 'ana' && contains(inputs.klasor, 'uyku'))) && secrets.TTS_VOICE_ID_UYKU || secrets.TTS_VOICE_ID_TR }}
      DOC_PLAYLIST_ID: ${{ secrets.DOC_PLAYLIST_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KLASOR: ${{ inputs.klasor }}
      # Belgeselde robot sese (edge-tts) düşmek yok: ElevenLabs hata verirse iş durur
      DOC_TTS_ENGINE: elevenlabs
      # Hızlanan paragrafları yeniden seslendirme için en fazla bu kadar kredi
      DOC_RUSH_BUDGET: "5000"
    steps:
      - name: Disk alanı aç
        # 1440p bölümler + final ≈ 11 GB; runner'daki kullanılmayan araçlar silinir
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: FFmpeg kur
        timeout-minutes: 8
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update -q || true
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y -q ffmpeg \
            || (sleep 20 && sudo apt-get -o DPkg::Lock::Timeout=180 install -y -q ffmpeg)

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          cd remotion && npm ci --no-audit --no-fund

      - name: Ses ve görsel önbelleğini geri yükle
        # Ses ElevenLabs kredisidir: tekrar çalıştırmada yeniden üretilmez.
        # Kayıt aşağıda "always()" ile yapılır: iş hata verse de ses kaybolmaz.
        id: onbellek
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.klasor }}/build/audio
            ${{ inputs.klasor }}/build/images
            ${{ inputs.klasor }}/build/films
            ${{ inputs.klasor }}/build/stock
            ${{ inputs.klasor }}/build/music
          key: belgesel-${{ inputs.klasor }}-${{ github.run_id }}
          restore-keys: belgesel-${{ inputs.klasor }}-

      - name: Ses yedeğini geri yükle (önbellekte yoksa)
        # GitHub önbelleği 10 GB'ı aşınca eski kayıtları siler; ses kalıcı olarak
        # "yedek-<klasör>" Release'inde de tutulur. Önbellekte yoksa oradan alınır.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="yedek-$(basename "$KLASOR")"
          if [ ! -f "$KLASOR/build/audio/manifest.json" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p ses.tar.gz -D /tmp --clobber
            mkdir -p "$KLASOR/build" && tar -xzf /tmp/ses.tar.gz -C "$KLASOR/build"
            echo "Ses yedeği geri yüklendi: $(ls "$KLASOR/build/audio" | wc -l) dosya"
          fi

      - name: Drive dosyasını Release'e aktar
        if: inputs.mod == 'drive'
        env:
          GH_TOKEN: ${{ github.token }}
          KAYNAK: ${{ inputs.kaynak_url }}
        run: |
          pip install -q gdown
          # Bağlantıdan dosya kimliği (…/d/<id>/… ya da ?id=<id>)
          ID=$(echo "$KAYNAK" | sed -E 's#.*/d/([^/?]+).*#\1#; s#.*[?&]id=([^&]+).*#\1#')
          gdown "$ID" -O /tmp/kaynak.bin
          ls -la /tmp/kaynak.bin
          TAG="klipler-$(basename "$KLASOR")"
          NAME="drive-$(date -u +%Y%m%d-%H%M%S).zip"
          mv /tmp/kaynak.bin "/tmp/$NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Klipler: $(basename "$KLASOR")" \
              --notes "Drive'dan aktarılan klip paketleri (otomatik)." --latest=false
          gh release upload "$TAG" "/tmp/$NAME" --clobber

      - name: ElevenLabs hesap ve ses kontrolü (kredi harcamaz)
        if: inputs.mod == 'seskontrol'
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          from scripts.notifier import send_message
          key = os.environ["ELEVENLABS_API_KEY"]
          scen = Path(os.environ["KLASOR"], "senaryo.json")
          vid = (json.loads(scen.read_text(encoding="utf-8")).get("voice_id") if scen.exists() else None) \
              or os.environ.get("TTS_VOICE_ID_TR", "")
          h = {"xi-api-key": key}
          def hata(r):   # ElevenLabs'in gerçek hata nedeni (ör. missing_permissions), anahtar yazılmaz
              try:
                  d = r.json().get("detail", {})
                  return f"HTTP {r.status_code} {d.get('status', '') if isinstance(d, dict) else ''} {d.get('message', d) if isinstance(d, dict) else d}"[:200]
              except ValueError:
                  return f"HTTP {r.status_code}"
          rs = requests.get("https://api.elevenlabs.io/v1/user/subscription", headers=h, timeout=30)
          sub = rs.json() if rs.ok else {}
          kalan = sub.get("character_limit", 0) - sub.get("character_count", 0)
          rv = requests.get("https://api.elevenlabs.io/v1/voices", headers=h, timeout=30)
          voices = rv.json().get("voices", []) if rv.ok else []
          mine = {v["voice_id"]: v["name"] for v in voices}
          if vid in mine:
              durum = f"✅ Ses hesapta var: {mine[vid]}"
          else:
              r = requests.get(f"https://api.elevenlabs.io/v1/voices/{vid}", headers=h, timeout=30)
              durum = (f"⚠️ Ses 'My Voices' listesinde yok, ama API erişebiliyor ({r.json().get('name')})"
                       if r.ok else f"❌ Ses okunamadı: {hata(r)}")
          # Gerçek seslendirme denemesi (~10 karakter): anahtar TTS yapabiliyor mu?
          rt = requests.post(f"https://api.elevenlabs.io/v1/text-to-speech/{vid}?output_format=mp3_44100_128",
                             headers=h, json={"text": "Merhaba.", "model_id": "eleven_multilingual_v2"}, timeout=60)
          tts = f"✅ Seslendirme denemesi çalıştı ({len(rt.content)} bayt)" if rt.ok else f"❌ Seslendirme denemesi: {hata(rt)}"
          msg = (f"🔎 ElevenLabs kontrolü ({os.environ['KLASOR']}, hesap: {os.environ.get('SES_HESABI')})\n"
                 f"{durum}\n{tts}\n"
                 f"Kalan kredi: {f'{kalan:,}' if rs.ok else 'okunamadı → ' + hata(rs)}\n"
                 f"Ses listesi: {', '.join(mine.values())[:300] if rv.ok else 'okunamadı → ' + hata(rv)}")
          print(msg)
          send_message(msg, parse_mode=None)
          PY
        env:
          SES_HESABI: ${{ inputs.ses_hesabi }}

      - name: Senaryoyu doğrula
        if: inputs.mod != 'inceleme' && inputs.mod != 'ses' && inputs.mod != 'drive' && inputs.mod != 'seskontrol'
        run: python -m scripts.doc_pipeline "$KLASOR" dogrula

      - name: Yalnızca ses üret (taslak)
        if: inputs.mod == 'ses'
        run: python -m scripts.doc_pipeline "$KLASOR" ses --taslak

      - name: İnceleme sayfaları üret
        if: inputs.mod == 'inceleme'
        run: python -m scripts.doc_pipeline "$KLASOR" inceleme

      - name: İnceleme sayfalarını dala yaz
        if: inputs.mod == 'inceleme'
        run: |
          SLUG=$(basename "$KLASOR")
          git config user.name "belgesel-bot"
          git config user.email "actions@github.com"
          git checkout -B "inceleme/$SLUG"
          git add -f "$KLASOR/inceleme/"*.jpg "$KLASOR/inceleme/"*.json
          git commit -m "inceleme: $SLUG kare ve aday sayfaları [skip ci]"
          for i in 1 2 3 4; do git push -f origin "inceleme/$SLUG" && break; sleep $((i * 5)); done

      - name: Örnek üret
        if: inputs.mod == 'ornek'
        run: |
          python -m scripts.doc_pipeline "$KLASOR" hepsi --ornek "${{ inputs.ornek_bolum }}"
          # Önizleme küçültülür (artifact alanı sınırlı); asıl kalite tam üretimde
          ffmpeg -v error -i "$KLASOR/build/ornek.mp4" -vf scale=1920:-2 -c:v libx264 \
            -preset medium -crf 21 -c:a copy -movflags +faststart ornek-1080p.mp4

      - name: Örneği paylaş
        if: inputs.mod == 'ornek'
        continue-on-error: true   # depolama kotası dolsa da iş başarısız sayılmasın
        uses: actions/upload-artifact@v4
        with:
          name: ornek-onizleme
          path: ornek-1080p.mp4
          retention-days: 5

      - name: Örneği ve haritaları Release'e yükle (Claude incelemesi için)
        if: inputs.mod == 'ornek'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="onizleme-$(basename "$KLASOR")"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Önizleme: $(basename "$KLASOR")" \
              --notes "Örnek render ve harita/kart dosyaları (otomatik)." --latest=false
          tar -czf /tmp/haritalar.tar.gz -C "$KLASOR/build" maps cards thumbs 2>/dev/null || true
          gh release upload "$TAG" ornek-1080p.mp4 /tmp/haritalar.tar.gz --clobber

      - name: Tam üretim
        if: inputs.mod == 'tam'
        run: python -m scripts.doc_pipeline "$KLASOR" hepsi

      - name: YouTube kimlik dosyalarını hazırla
        if: inputs.mod == 'tam' || inputs.mod == 'shorts'
        env:
          CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
          TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          echo "$CLIENT_SECRETS_B64" | base64 -d > client_secrets.json
          echo "$TOKEN_B64" | base64 -d > youtube_token.pickle

      - name: YouTube'a gizli yükle
        if: inputs.mod == 'tam'
        run: |
          if [ -n "${{ inputs.yayin }}" ]; then
            python -m scripts.doc_pipeline "$KLASOR" yukle --yayin "${{ inputs.yayin }}"
          else
            python -m scripts.doc_pipeline "$KLASOR" yukle
          fi

      - name: Shorts üret ve gizli + planlı yükle
        if: inputs.mod == 'shorts'
        # Belgeselin önbellekteki sesi ve görselleri kullanılır: yeni ElevenLabs kredisi yok
        run: |
          if [ -n "${{ inputs.sadece }}" ]; then
            python -m scripts.doc_shorts "$KLASOR" --yukle --sadece "${{ inputs.sadece }}"
          else
            python -m scripts.doc_shorts "$KLASOR" --yukle --sosyal
          fi

      - name: Sosyal medya paketi üret (YouTube'a yüklemeden)
        if: inputs.mod == 'sosyal'
        # Önceden yüklenmiş Short'lar için TikTok/Instagram/Facebook kopyaları; kredi harcanmaz
        run: python -m scripts.doc_shorts "$KLASOR" --sosyal

      - name: Sosyal medya paketini Release'e yükle
        if: (inputs.mod == 'shorts' && inputs.sadece == '') || inputs.mod == 'sosyal'
        # Release dosyaları artifact kotasına girmez; günlük sosyal.yml buradan indirir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sosyal-$(basename "$KLASOR")"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Sosyal medya: $(basename "$KLASOR")" \
              --notes "Shorts'ların TikTok/Instagram/Facebook kopyaları (otomatik)." --latest=false
          gh release upload "$TAG" "$KLASOR"/build/sosyal/*.mp4 "$KLASOR"/build/sosyal/manifest.json --clobber

      - name: Shorts dosyalarını paylaş
        if: inputs.mod == 'shorts'
        continue-on-error: true   # depolama kotası dolsa da iş başarısız sayılmasın
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            ${{ inputs.klasor }}/build/shorts/*.mp4
            ${{ inputs.klasor }}/build/shorts/shorts.json
          retention-days: 14

      - name: Kapakları ve altyazıyı paylaş
        if: inputs.mod == 'tam'
        continue-on-error: true   # depolama kotası dolsa da iş başarısız sayılmasın
        uses: actions/upload-artifact@v4
        with:
          name: kapaklar-altyazi
          path: |
            ${{ inputs.klasor }}/build/thumbs/*.jpg
            ${{ inputs.klasor }}/build/altyazi.srt
            ${{ inputs.klasor }}/build/aciklama.txt
            ${{ inputs.klasor }}/build/ozet.json
            ${{ inputs.klasor }}/build/yukleme.json
          retention-days: 14

      - name: Ses ve görsel önbelleğini kaydet (hata olsa da)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ inputs.klasor }}/build/audio
            ${{ inputs.klasor }}/build/images
            ${{ inputs.klasor }}/build/films
            ${{ inputs.klasor }}/build/stock
            ${{ inputs.klasor }}/build/music
          key: belgesel-${{ inputs.klasor }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sesi kalıcı yedekle (Release)
        # Ses ElevenLabs kredisidir; önbellek silinse bile kaybolmasın
        if: always() && inputs.mod != 'inceleme'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$KLASOR/build/audio/manifest.json" ] || exit 0
          TAG="yedek-$(basename "$KLASOR")"
          tar -czf /tmp/ses.tar.gz -C "$KLASOR/build" audio
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Ses yedeği: $(basename "$KLASOR")" \
              --notes "ElevenLabs seslendirmesinin kalıcı yedeği (otomatik)." --latest=false
          gh release upload "$TAG" /tmp/ses.tar.gz --clobber

      - name: Telegram bildirimi
        if: always()
        env:
          SONUC: ${{ job.status }}
          MOD: ${{ inputs.mod }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path
          from scripts.notifier import send_message
          klasor, mod, sonuc, url = os.environ["KLASOR"], os.environ["MOD"], os.environ["SONUC"], os.environ["RUN_URL"]
          if sonuc != "success":
              hata = Path(klasor, "build", "hata.txt")
              neden = f"\nNeden: {hata.read_text()}" if hata.exists() else ""
              send_message(f"❌ Belgesel ({mod}) başarısız: {klasor}{neden}\n{url}")
          elif mod == "inceleme":
              from scripts.notifier import send_photo
              sheets = sorted(Path(klasor, "inceleme").glob("*.jpg"))
              send_message(f"🔎 İnceleme sayfaları hazır ({len(sheets)} sayfa): {klasor}\n{url}")
              for p in sheets[:10]:
                  send_photo(str(p), p.stem)
          elif mod == "shorts":
              rows = json.loads(Path(klasor, "build", "shorts", "shorts.json").read_text())
              send_message("📱 Shorts GİZLİ yüklendi ve planlandı:\n" + "\n".join(
                  f"• {r['id']} ({r['seconds']:.0f} sn) → {r.get('url')} · yayın {r.get('yayin')}" for r in rows))
          elif mod == "sosyal":
              rows = json.loads(Path(klasor, "build", "sosyal", "manifest.json").read_text())
              send_message(f"📦 Sosyal medya paketi hazır ({len(rows)} Short): {klasor}\n"
                           + "\n".join(f"• {r['id']} ({r['sure']:.0f} sn)" for r in rows))
          elif mod == "seskontrol":
              pass
          elif mod == "drive":
              send_message(f"📥 Drive paketi Release'e aktarıldı: {klasor}\n{url}")
          elif mod == "ses":
              man = json.loads(Path(klasor, "build", "audio", "manifest.json").read_text())
              sure = sum(p["duration"] for ch in man for p in ch)
              send_message(f"🎙️ Anlatım hazır: {klasor} · {sum(len(c) for c in man)} paragraf, "
                           f"{sure/60:.1f} dk saf anlatım. Yedeklendi; kurgu bu sürelere göre kurulacak.\n{url}")
          elif mod == "ornek":
              send_message(f"🎬 Örnek önizleme hazır: {klasor}\nİndirme (Artifacts → ornek-onizleme): {url}")
          else:
              y = json.loads(Path(klasor, "build", "yukleme.json").read_text())
              ozet = json.loads(Path(klasor, "build", "ozet.json").read_text())
              plan = f"Planlı yayın: {y['publish_at']}" if y.get("publish_at") else "Gizli — Studio'dan yayınlayın"
              ses = ", ".join("ElevenLabs" if e == "elevenlabs" else e for e in ozet.get("tts_engines", []))
              send_message(f"✅ Belgesel GİZLİ yüklendi ({ozet['total_seconds']/60:.0f} dk, {ozet['lufs']:.1f} LUFS)\n"
                           f"Ses: {ses} · Müzik: {'var' if ozet.get('music') else 'yok'}\n"
                           f"{y['url']}\n{plan}\nİzleyip onaylayın.")
          EOF
