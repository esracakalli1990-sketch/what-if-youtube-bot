name: Otonom Video Üretimi

# Kanal kadansı:
#   - Her gün 09:00 UTC → 1 YouTube Short (public)
#   - Pazartesi & Perşembe 08:00 UTC → 1 uzun video (bir sonraki 15:00 UTC'ye planlı)
#   - Pazar 07:00 UTC → konu havuzunu Gemini ile doldur
#
# Gerekli repository secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY, ELEVENLABS_API_KEY, CHARACTER_VOICE_ID, REPLICATE_API_TOKEN
#   YOUTUBE_CLIENT_SECRETS_B64  → base64 -w0 client_secrets.json
#   YOUTUBE_TOKEN_B64           → base64 -w0 youtube_token.pickle
#   YOUTUBE_PLAYLIST_ID (opsiyonel)
# YouTube secret'ları yoksa video yine üretilir ve Actions artifact'ı olarak saklanır,
# sadece yükleme adımı atlanır.

on:
  schedule:
    - cron: "0 9 * * *"    # günlük Short
    - cron: "0 8 * * 1,4"  # Pzt & Per uzun video
    - cron: "0 7 * * 0"    # Pazar konu doldurma
  workflow_dispatch:
    inputs:
      job_type:
        description: "Üretim tipi"
        type: choice
        options: [short, long, refill]
        default: short
      topic:
        description: "Konu (boşsa havuzdan seçilir; sadece short/long)"
        required: false
      force:
        description: "Bekleyen üretimi iptal edip yeniden başlat (short/long)"
        type: boolean
        default: false

concurrency:
  group: video-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CHARACTER_VOICE_ID: ${{ secrets.CHARACTER_VOICE_ID }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Görsel sağlayıcı seçimi (Settings → Secrets and variables → Actions → Variables)
      IMAGE_PRIMARY: ${{ vars.IMAGE_PRIMARY }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
      IMAGE_MODE: ${{ vars.IMAGE_MODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Üretim tipini belirle
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job_type=${{ inputs.job_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * 1,4" ]; then
            echo "job_type=long" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 0" ]; then
            echo "job_type=refill" >> "$GITHUB_OUTPUT"
          else
            echo "job_type=short" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg kur
        if: steps.type.outputs.job_type != 'refill'
        timeout-minutes: 8
        run: |
          # apt/dpkg kilidi bekleyen süreçlere karşı kilit zaman aşımı + tek deneme tekrarı
          sudo apt-get -o DPkg::Lock::Timeout=180 update -q || true
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y -q ffmpeg \
            || (sleep 20 && sudo apt-get -o DPkg::Lock::Timeout=180 install -y -q ffmpeg)

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: YouTube kimlik dosyalarını hazırla
        env:
          CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
          TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          if [ -n "$CLIENT_SECRETS_B64" ] && [ -n "$TOKEN_B64" ]; then
            echo "$CLIENT_SECRETS_B64" | base64 -d > client_secrets.json
            echo "$TOKEN_B64" | base64 -d > youtube_token.pickle
            echo "YouTube kimlik dosyaları hazır — otomatik yükleme aktif."
          else
            echo "::warning::YouTube secret'ları tanımlı değil — video üretilecek ama yüklenmeyecek."
          fi

      - name: Konu havuzunu doldur + haftalık rapor
        if: steps.type.outputs.job_type == 'refill'
        run: |
          python scripts/scheduler.py --refill 15
          python scripts/notifier.py --report || true
          # Haftalık derin analitik (retention/izlenme süresi/abone) — Telegram'a
          python scripts/analytics.py --deep-send --days 7 || true

      - name: Bekleyen üretimi iptal et (force)
        if: inputs.force == true && steps.type.outputs.job_type != 'refill'
        run: |
          python -c "from scripts.manual_images import cancel_pending; print('Bekleyen iptal edildi:', cancel_pending())"

      - name: Short üret
        if: steps.type.outputs.job_type == 'short'
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            python main.py --shorts "${{ inputs.topic }}" --privacy public
          else
            python scripts/scheduler.py --short --privacy public
          fi

      - name: Uzun video üret
        if: steps.type.outputs.job_type == 'long'
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            python main.py "${{ inputs.topic }}" --privacy public
          else
            python scripts/scheduler.py --batch 1 --privacy public
          fi

      - name: Durum dosyalarını commit'le
        if: always()
        run: |
          git config user.name "what-if-bot"
          git config user.email "actions@github.com"
          # Dosyalar tek tek eklenir: git add, listedeki TEK bir dosya yoksa
          # hiçbirini eklemeden ölür (bu hata topics.json'ın kalıcılaşmasını engelliyordu)
          for f in topics.json output/uploads.json pending_production.json telegram_state.json shorts_queue.json output/analytics_snapshot.json; do
            git add -f "$f" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "bot: üretim durumu güncellendi [skip ci]"
            # Push'u yeniden dene: GitHub zaman zaman geçici sunucu hatası
            # döndürüyor ("remote: fatal error in commit_refs"). Burada durum
            # kaybı daha pahalı — yüklenen videonun kaydı (uploads.json) yazılmazsa
            # çift yayın koruması onu göremez.
            pushed=0
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              echo "push başarısız (deneme ${attempt}/4) — bekleyip tekrar denenecek"
              sleep $((attempt * 10))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Üretim durumu push edilemedi (4 deneme)."
              exit 1
            fi
          else
            echo "Durum değişikliği yok."
          fi

      - name: Videoyu artifact olarak sakla
        if: steps.type.outputs.job_type != 'refill'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.type.outputs.job_type }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.png
            output/*.srt
          retention-days: 5
          if-no-files-found: warn

      - name: Hata bildirimi (Telegram)
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG=$(printf '🚨 <b>Otomasyon hatası</b> — %s işi başarısız oldu.\n\nDetay: %s' \
              "${{ steps.type.outputs.job_type }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="HTML" \
              --data-urlencode text="$MSG" || true
          fi
