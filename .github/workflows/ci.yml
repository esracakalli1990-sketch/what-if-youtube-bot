name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg kur
        timeout-minutes: 8
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update -q || true
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y -q ffmpeg \
            || (sleep 20 && sudo apt-get -o DPkg::Lock::Timeout=180 install -y -q ffmpeg)

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Testleri çalıştır
        run: pytest tests/ -v
